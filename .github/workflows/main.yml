name: Build and Deploy CodeChef Archive

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger option

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests  # If needed; old script has none

      - name: Run Python script to generate JSON and README
        run: python Web/generate.py

      - name: Commit and push changes to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update: Generated solutions.json and README.md"
          file_pattern: Web/solutions.json README.md
          add_options: '--force'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Web
          force_orphan: true  